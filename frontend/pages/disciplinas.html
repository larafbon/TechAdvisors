<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Disciplinas - Techadvisors</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../static/home.css">
  <link rel="stylesheet" href="../static/config.css">
  <script src="../js/config.js" defer></script>
  <script src="../js/disciplinas.js" defer></script>
</head>
<body class="bg-[#f3f7fb]">

  <header class="home-header">
    <div class="logo cursor-pointer" onclick="window.location.href='index.html'">
      📘 TECHADVISORS <span class="text-xs bg-purple-200 text-purple-900 px-2 py-0.5 rounded font-bold ml-2">ALUNO</span>
    </div>
    <nav>
      <ul>
        <li onclick="window.location.href='alunos.html'" class="cursor-pointer">🎓 Portal do Estudante</li>
        <li onclick="window.location.href='sobre.html'" class="cursor-pointer">ℹ️ Sobre</li>
        <li onclick="toggleSettingsDrawer(true)" class="cursor-pointer">⚙️ Acessibilidade</li>
      </ul>
    </nav>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <div class="pt-2 mb-6">
      <button onclick="window.location.href='alunos.html'" class="inline-flex items-center gap-2 text-sm font-semibold text-slate-600 hover:text-purple-700 transition-colors cursor-pointer">
        ← Voltar ao Portal
      </button>
    </div>

    <div class="banner mb-8">
      <h2>📖 Minhas Disciplinas</h2>
      <p>Consulte as matérias matriculadas da sua turma e acesse as atividades pendentes.</p>
    </div>

    <!-- Container Dinâmico de Disciplinas -->
    <div id="lista-disciplinas-container" class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="bg-white p-6 rounded-3xl text-center text-slate-500 md:col-span-3">
        Carregando disciplinas...
      </div>
    </div>
  </main>

  <footer class="home-footer">
    © 2026 • Techadvisors — Disciplinas do Aluno
  </footer>

  <button onclick="toggleSettingsDrawer(true)" title="Configurações e Acessibilidade" class="fixed bottom-6 right-6 z-40 bg-[#5b21b6] hover:bg-purple-900 text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center border-2 border-white/20 transition-all hover:scale-105 active:scale-95 text-xl cursor-pointer">
    ⚙️
  </button>
  <div id="settings-overlay" onclick="toggleSettingsDrawer(false)" class="hidden-drawer"></div>
  <aside id="settings-drawer" class="hidden-drawer">
    <!-- Gaveta mantida -->
  </aside>
</body>
</html>
